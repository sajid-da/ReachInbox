services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: DEFAULT_SENDER_EMAIL
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: reachinbox-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: reachinbox-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: PROCESSING_TIMEOUT_MS
        value: "120000"
      - key: WORKER_LOCK_DURATION_MS
        value: "120000"
      - key: MIN_SEND_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"
      - key: RUN_WORKER
        value: "false"

  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: DEFAULT_SENDER_EMAIL
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: DEFAULT_SENDER_EMAIL
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: SMTP_PASS
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: PROCESSING_TIMEOUT_MS
        value: "120000"
      - key: WORKER_LOCK_DURATION_MS
        value: "120000"
      - key: MIN_SEND_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"

  - type: web
    name: reachinbox-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist/client
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: reachinbox-redis
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow Render services to connect

databases:
  - name: reachinbox-postgres
    plan: free
    postgresMajorVersion: "16"
